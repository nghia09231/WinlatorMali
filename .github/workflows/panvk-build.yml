name: Build Winlator Mali PanVK G615 (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0" "cmake;3.22.1" "ndk;29.0.14206865"
      - name: Validate PanVK archive and ABI
        shell: bash
        run: |
          set -euo pipefail
          A=app/src/main/assets/graphics_driver/adrenotools-panvk-g615.tzst
          echo "5527114f9057e261ee06d8d5000683587a509efec1017ae6e0e71adf4f859ed8  $A" | sha256sum -c -
          mkdir -p /tmp/panvk-verify
          tar --use-compress-program=unzstd -xf "$A" -C /tmp/panvk-verify
          python3 - <<'PY'
          import json, struct, hashlib
          from pathlib import Path
          p=Path('/tmp/panvk-verify')
          meta=json.loads((p/'meta.json').read_text())
          so=(p/'libvulkan_panfrost.so').read_bytes()
          assert so[:4]==bytes.fromhex('7f454c46') and so[4]==2 and so[5]==1
          assert struct.unpack_from('<H',so,18)[0]==183
          assert meta['minApi']==35 and meta['libraryName']=='libvulkan_panfrost.so'
          assert hashlib.sha256(so).hexdigest()=='d000493e634541c043c5b6ca3849594cc84066748b95d62be1d99ec28db034c3'
          print('ARM64 ELF + metadata + SHA256 verified. Runtime not verified.')
          PY
      - name: Patch driver selection and Vulkan version handling
        shell: bash
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          base = Path('app/src/main/java/com/winlator/cmod')
          def patch(file, before, after):
              path = base / file
              content = path.read_text()
              if content.count(before) != 1:
                  raise SystemExit(f'Patch mismatch {file}: {content.count(before)} matches')
              path.write_text(content.replace(before, after))
          
          patch('core/GPUInformation.java',
                'if (!isAdrenoGPU(context) && !driverName.equals("System"))',
                'if (!isAdrenoGPU(context) && !driverName.equals("System") && !driverName.equals("panvk-g615"))')
          
          patch('contents/AdrenotoolsManager.java',
                '        return driversList;\n    }\n    \n    public boolean isFromResources',
                '''        if (isFromResources("panvk-g615")) {
                      if (extractDriverFromResources("panvk-g615")
                              && !driversList.contains("panvk-g615"))
                          driversList.add("panvk-g615");
                  }
                  return driversList;
              }
          
              public boolean isFromResources''')
          
          patch('contents/AdrenotoolsManager.java',
                '    public String getDriverPath(String adrenotoolsDriverId) {\n        return adrenotoolsContentDir.getAbsolutePath() + "/" + adrenotoolsDriverId + "/";\n    }',
                '''    public String getDriverPath(String adrenotoolsDriverId) {
                  if ("panvk-g615".equals(adrenotoolsDriverId) && isFromResources(adrenotoolsDriverId))
                      extractDriverFromResources(adrenotoolsDriverId);
                  return adrenotoolsContentDir.getAbsolutePath() + "/" + adrenotoolsDriverId + "/";
              }''')
          
          patch('XServerDisplayActivity.java',
                'String vulkanVersionPatch = GPUInformation.getVulkanVersion(adrenoToolsDriverId, this).split("\\\\.")[2];',
                '''String queriedVulkanVersion = GPUInformation.getVulkanVersion(adrenoToolsDriverId, this);
                  String[] vulkanParts = queriedVulkanVersion != null ? queriedVulkanVersion.split("\\\\.") : new String[0];
                  String vulkanVersionPatch = vulkanParts.length >= 3 ? vulkanParts[2] : "0";''')
          print('PanVK build-time Java changes applied.')
          PY
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleStandardDebug --no-daemon --stacktrace
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winlator-mali-panvk-g615-experimental
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
